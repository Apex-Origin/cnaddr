<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" fill="none" role="img" aria-label="cnaddr - 智能中文地址解析">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0e1830"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="brandText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="26" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#9fb4d6" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#dots)"/>
  <circle cx="150" cy="20" r="380" fill="url(#glowBlue)"/>
  <circle cx="1180" cy="400" r="360" fill="url(#glowCyan)"/>
  <rect x="0.5" y="0.5" width="1279" height="399" stroke="#22304d" stroke-opacity="0.6"/>

  <!-- ================= LEFT ================= -->
  <!-- logo pin -->
  <g transform="translate(70,58) scale(2.1)">
    <path d="M12 2.2c-3.95 0-7 3.02-7 7 0 4.9 6.1 11.86 6.36 12.15a.86.86 0 0 0 1.28 0C13.9 21.06 20 14.1 20 9.2c0-3.98-3.05-7-8-7z" fill="url(#brand)"/>
    <circle cx="12" cy="9" r="3.1" fill="#ffffff"/>
    <circle cx="12" cy="9" r="1.3" fill="#2563eb"/>
  </g>
  <text x="124" y="80" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" fill="#7e93b6" letter-spacing="0.6">极数本源 · ApiZero</text>

  <!-- wordmark -->
  <text x="68" y="178" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-weight="800" font-size="82" fill="#f3f7fd" letter-spacing="-1.5">cnaddr</text>

  <!-- tagline -->
  <text x="72" y="226" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-weight="700" font-size="30" fill="url(#brandText)">智能中文地址解析</text>

  <!-- subtitle -->
  <text x="72" y="266" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="17" fill="#90a2c0">把任意一段中文地址，秒变结构化数据</text>
  <text x="72" y="293" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="17" fill="#90a2c0">省 / 市 / 区 / 镇 + 姓名 / 手机 / 身份证 / 邮编</text>

  <!-- feature pills -->
  <g font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="14" font-weight="600">
    <g>
      <rect x="72" y="322" width="74" height="30" rx="15" fill="#12243f" stroke="#33517f"/>
      <text x="109" y="342" fill="#8fd0ff" text-anchor="middle">零依赖</text>
    </g>
    <g>
      <rect x="156" y="322" width="74" height="30" rx="15" fill="#12243f" stroke="#33517f"/>
      <text x="193" y="342" fill="#8fd0ff" text-anchor="middle">反向补全</text>
    </g>
    <g>
      <rect x="240" y="322" width="74" height="30" rx="15" fill="#0f2b2b" stroke="#1f5f57"/>
      <text x="277" y="342" fill="#5fe3c0" text-anchor="middle">混合抽取</text>
    </g>
    <g>
      <rect x="324" y="322" width="98" height="30" rx="15" fill="#12243f" stroke="#33517f"/>
      <text x="373" y="342" fill="#8fd0ff" text-anchor="middle">TypeScript</text>
    </g>
    <g>
      <rect x="432" y="322" width="56" height="30" rx="15" fill="#2a2410" stroke="#6b5a1f"/>
      <text x="460" y="342" fill="#f5cf6b" text-anchor="middle">MIT</text>
    </g>
  </g>

  <!-- ================= RIGHT (parse card) ================= -->
  <g filter="url(#cardShadow)">
    <rect x="688" y="72" width="520" height="256" rx="18" fill="#0f1b30" stroke="#26344f"/>
  </g>
  <!-- header -->
  <circle cx="712" cy="100" r="5" fill="#f43f5e"/>
  <circle cx="730" cy="100" r="5" fill="#f59e0b"/>
  <circle cx="748" cy="100" r="5" fill="#34d399"/>
  <text x="770" y="105" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="13" fill="#6b7f9e">parse()</text>
  <line x1="688" y1="122" x2="1208" y2="122" stroke="#1f2c45"/>

  <!-- input -->
  <text x="712" y="152" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#6b7f9e">输入</text>
  <text x="712" y="180" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="13" fill="#cdd9ec">张三 13812345678 浙江省杭州市余杭区五常街道文一西路969号 311121</text>

  <line x1="712" y1="200" x2="1184" y2="200" stroke="#1f2c45" stroke-dasharray="3 4"/>
  <text x="712" y="222" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#6b7f9e">输出</text>
  <!-- chips row 1 -->
  <g font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600">
    <g>
      <rect x="712" y="232" width="92" height="30" rx="9" fill="#12233f" stroke="#3a5a8c"/>
      <text x="724" y="252" fill="#9cc6ff">省 <tspan fill="#e7eefb">浙江省</tspan></text>
    </g>
    <g>
      <rect x="812" y="232" width="92" height="30" rx="9" fill="#0c2a30" stroke="#1d6577"/>
      <text x="824" y="252" fill="#79e0ef">市 <tspan fill="#e7eefb">杭州市</tspan></text>
    </g>
    <g>
      <rect x="912" y="232" width="92" height="30" rx="9" fill="#12233f" stroke="#3a5a8c"/>
      <text x="924" y="252" fill="#9cc6ff">区 <tspan fill="#e7eefb">余杭区</tspan></text>
    </g>
    <g>
      <rect x="1012" y="232" width="108" height="30" rx="9" fill="#0f2a22" stroke="#1f6b4f"/>
      <text x="1024" y="252" fill="#74e2b6">镇 <tspan fill="#e7eefb">五常街道</tspan></text>
    </g>
  </g>

  <!-- chips row 2 -->
  <g font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600">
    <g>
      <rect x="712" y="272" width="92" height="30" rx="9" fill="#2a2210" stroke="#6f5a1d"/>
      <text x="724" y="292" fill="#f3cd6e">姓名 <tspan fill="#e7eefb">张三</tspan></text>
    </g>
    <g>
      <rect x="812" y="272" width="140" height="30" rx="9" fill="#0f2a22" stroke="#1f6b4f"/>
      <text x="824" y="292" fill="#74e2b6">手机 <tspan fill="#e7eefb">13812345678</tspan></text>
    </g>
    <g>
      <rect x="960" y="272" width="92" height="30" rx="9" fill="#231a2e" stroke="#5b4a82"/>
      <text x="972" y="292" fill="#c4a6f5">邮编 <tspan fill="#e7eefb">311121</tspan></text>
    </g>
    <g>
      <rect x="1060" y="272" width="60" height="30" rx="9" fill="#2a1c10" stroke="#7a4f22"/>
      <text x="1090" y="292" fill="#f0a868" text-anchor="middle">详细</text>
    </g>
  </g>
</svg>
